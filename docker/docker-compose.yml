# AI Bot Platform - Production Stack
# Single command: docker-compose up -d

name: ai-bot-platform

services:
  # ─────────────────────────────────────────────
  # Traefik - Reverse Proxy & Load Balancer
  # ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: aibot_traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard (dev only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/etc/traefik/certs
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # Frontend - React SPA
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aibot_frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # Backend API - FastAPI
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aibot_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - AI_GATEWAY_URL=http://ai-gateway:8002
      - BOT_RUNTIME_URL=http://bot-runtime:8001
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - redis
      - ai-gateway
      - bot-runtime
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # Bot Runtime Engine
  # ─────────────────────────────────────────────
  bot-runtime:
    build:
      context: ../bot-runtime
      dockerfile: Dockerfile
    container_name: aibot_bot_runtime
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - AI_GATEWAY_URL=http://ai-gateway:8002
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bot_logs:/app/logs
    depends_on:
      - redis
      - postgres
      - ai-gateway
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # AI Gateway - Unified LLM Interface
  # ─────────────────────────────────────────────
  ai-gateway:
    build:
      context: ../ai-gateway
      dockerfile: Dockerfile
    container_name: aibot_ai_gateway
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ai_cache:/app/cache
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # PostgreSQL with pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: aibot_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # Redis - Cache, Sessions, Queues
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aibot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # MinIO - S3-compatible Object Storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: aibot_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - aibot_network

  # ─────────────────────────────────────────────
  # Ollama - Local LLM (Optional)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aibot_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aibot_network
    profiles:
      - local-llm  # Start with: docker-compose --profile local-llm up

networks:
  aibot_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  traefik_certs:
  ai_cache:
  bot_logs:
